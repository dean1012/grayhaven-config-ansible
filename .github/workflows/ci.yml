name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25.0.0

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master
        with:
          version: v0.11.0
          additional_files: files/grayhaven-ansible-runner files/grayhaven-ansible-poller roles/admin_access/files/gtmux

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Run Python syntax checks
        run: >-
          python -m py_compile
          files/grayhaven-gcs-restic-bucket-cleanup
          files/grayhaven-reboot-notify
          files/grayhaven-refresh-motd
          files/grayhaven-ansible-automation-status
          roles/deploy_websites/files/grayhaven-website-deploy
          roles/restic_backup/files/grayhaven-restic-duration
          roles/observability/files/grayhaven-grafana-alert-sync
          roles/observability/files/grayhaven-irm-alert-groups-textfile
          roles/observability/files/grayhaven-observability-textfile
          scripts/validate-generated-grafana-alerts
          scripts/validate-observability-textfile-cache
          scripts/validate-rendered-alloy-config
          scripts/validate-rendered-timetracker-config

      - name: Install Alloy validation tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-transport-https gpg wget
          sudo mkdir -p /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/grafana.asc https://apt.grafana.com/gpg-full.key
          sudo chmod 644 /etc/apt/keyrings/grafana.asc
          echo "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main" \
          | sudo tee /etc/apt/sources.list.d/grafana.list
          sudo apt-get update
          sudo apt-get install --yes alloy

      - name: Install Ansible validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --requirement pip3_requirements.txt
          python -m pip install ansible-lint==26.6.0

      - name: Validate rendered Alloy config
        run: |
          scripts/validate-rendered-alloy-config
          scripts/validate-rendered-alloy-config --role mcp

      - name: Validate generated Grafana alerts
        run: scripts/validate-generated-grafana-alerts

      - name: Validate observability textfile cache
        run: scripts/validate-observability-textfile-cache

      - name: Validate rendered Time Tracker config
        run: scripts/validate-rendered-timetracker-config

      - name: Install Ansible Galaxy collections
        run: scripts/install-galaxy-collections

      - name: Run Ansible syntax check
        run: |
          find playbooks -type f \( -name "*.yml" -o -name "*.yaml" \) -print0 \
          | xargs -0 -n1 ansible-playbook -i tests/fixtures/syntax-inventory.yml --connection=local --syntax-check

      - name: Validate MCP deployment contracts
        run: python -m unittest tests.test_mcp_role tests.test_mcp_monitoring -v

      - name: Run Time Tracker contract check
        run: >-
          ansible-playbook --check -i localhost, --connection=local
          playbooks/validate-timetracker-contract.yml

      - name: Run ansible-lint
        run: ansible-lint .
