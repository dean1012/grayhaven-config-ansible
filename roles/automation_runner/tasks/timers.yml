---
- name: Manage bastion runner timer
  ansible.builtin.systemd_service:
    name: grayhaven-ansible-runner.timer
    enabled: "{{ automation_runner_effective_is_control_node }}"
    state: "{{ 'started' if automation_runner_effective_is_control_node else 'stopped' }}"
    daemon_reload: true
  when: grayhaven_role == "bastion"
  vars:
    automation_runner_effective_is_control_node: >-
      {{
        automation_runner_bootstrap_is_control_node
        if automation_runner_bootstrap_is_control_node is defined
        else 'control-node' in (do_tags | default([]))
      }}

- name: Manage bastion poller timer
  ansible.builtin.systemd_service:
    name: grayhaven-ansible-poller.timer
    enabled: "{{ automation_runner_effective_is_control_node }}"
    state: "{{ 'started' if automation_runner_effective_is_control_node else 'stopped' }}"
    daemon_reload: true
  when: grayhaven_role == "bastion"
  vars:
    automation_runner_effective_is_control_node: >-
      {{
        automation_runner_bootstrap_is_control_node
        if automation_runner_bootstrap_is_control_node is defined
        else 'control-node' in (do_tags | default([]))
      }}
