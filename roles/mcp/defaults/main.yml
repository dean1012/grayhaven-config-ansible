---
mcp_user: mcp
mcp_group: mcp
mcp_uid: 778
mcp_gid: 778
mcp_root: /var/lib/grayhaven/mcp
mcp_image_repository: ghcr.io/dean1012/grayhaven-mcp
mcp_configuration_api_url: https://api.github.com/repos/dean1012/grayhaven-mcp
mcp_configuration_environment: >-
  {{ 'production' if baseline_validation_environment in ['prod', 'production'] else 'staging' }}
mcp_container_name: grayhaven-mcp
mcp_service_name: grayhaven-mcp.service
mcp_host_port: 8787
mcp_config_overrides: {}
mcp_tls_mode: host
mcp_certbot_credentials_file: /etc/letsencrypt/digitalocean.ini
mcp_certbot_marker_dir: /etc/grayhaven/certbot
mcp_health_path: /healthz
mcp_readiness_path: /readyz
mcp_maintenance_cpu_quota_percent: 20
mcp_maintenance_cpu_weight: 20
