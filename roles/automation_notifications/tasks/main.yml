---
- name: Validate Discord notification variables
  ansible.builtin.assert:
    that:
      - automation_notifications_discord_webhook_id is defined
      - automation_notifications_discord_webhook_id is string
      - automation_notifications_discord_webhook_id | trim | length > 0
      - automation_notifications_discord_webhook_token is defined
      - automation_notifications_discord_webhook_token is string
      - automation_notifications_discord_webhook_token | trim | length > 0
      - automation_notifications_title is defined
      - automation_notifications_title is string
      - automation_notifications_title | trim | length > 0
      - automation_notifications_color is defined
    fail_msg: "Required Discord notification variables were not provided."
    quiet: true
  no_log: true

- name: Build local notification timestamp
  ansible.builtin.command:
    cmd: date '+%Y-%m-%d %I:%M %p %Z'
  environment:
    TZ: "{{ automation_notifications_timezone }}"
  register: automation_notifications_timestamp
  changed_when: false

- name: Reset Discord notification retry state
  ansible.builtin.set_fact:
    automation_notifications_attempt: 0
    automation_notifications_retry_delay: 0
  changed_when: false

- name: Send Discord automation notification with retries
  ansible.builtin.include_tasks: send-discord-notification.yml

- name: Fail rejected Discord automation notification
  ansible.builtin.fail:
    msg: >-
      Discord automation notification was rejected with HTTP
      {{ automation_notifications_discord_response.status | default('no response') }}.
  when: >-
    automation_notifications_discord_response.status | default(0) != 204
    and automation_notifications_discord_response.status is defined
    and automation_notifications_discord_response.status > 0
    and automation_notifications_discord_response.status != 429
    and (
      automation_notifications_discord_response.status < 500
      or automation_notifications_discord_response.status > 599
    )
  changed_when: false

- name: Warn when Discord automation notification retries are exhausted
  ansible.builtin.debug:
    msg: >-
      WARNING: Discord automation notification was not delivered after retrying
      transient failures (last response: HTTP
      {{ automation_notifications_discord_response.status | default('no response') }}).
  when: automation_notifications_discord_response.status | default(0) != 204
