---
- name: Permit bastion administrators to follow the Ansible playbook log
  ansible.builtin.copy:
    dest: /etc/sudoers.d/grayhaven-ansible-playbook-log
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      %wheel ALL=(root) NOPASSWD: /usr/bin/tail -F /var/run/grayhaven-ansible-runner/playbook.log
  when: grayhaven_role == "bastion"

- name: Remove Ansible playbook log access from non-bastion hosts
  ansible.builtin.file:
    path: /etc/sudoers.d/grayhaven-ansible-playbook-log
    state: absent
  when: grayhaven_role != "bastion"
