---
observability_alloy_package: alloy
observability_alloy_repo_name: grafana
observability_alloy_repo_baseurl: https://rpm.grafana.com
observability_alloy_repo_gpgkey: https://rpm.grafana.com/gpg.key

observability_config_dir: /etc/grayhaven/observability
observability_alloy_token_file: "{{ observability_config_dir }}/grafana-alloy-token"
observability_alert_sync_config_file: "{{ observability_config_dir }}/grafana-alert-sync.json"
observability_alert_uid_registry_file: "{{ observability_config_dir }}/grafana-alert-rule-uids.json"
observability_alert_initial_silence_marker_file: "{{ observability_config_dir }}/initial-alert-silence-created"
observability_irm_alert_groups_config_file: "{{ observability_config_dir }}/irm-alert-groups.json"
observability_textfile_config_file: "{{ observability_config_dir }}/textfile-metrics.json"
observability_textfile_dir: /var/lib/grayhaven/observability/textfile
observability_gcs_operation_cache_file: "{{ observability_textfile_dir }}/gcs-operation-counts.json"
observability_google_monitoring_usage_cache_file: >-
  {{ observability_textfile_dir }}/google-monitoring-usage.json
observability_alloy_http_url: http://127.0.0.1:12345
observability_alloy_ready_retries: 30
observability_alloy_ready_delay: 2
observability_alloy_remote_write_retries: 60
observability_alloy_remote_write_delay: 5
observability_alert_initial_silence_minutes: 15

observability_grafana_default_folder: Grayhaven Systems LLC
observability_grafana_default_evaluation_group: grayhaven-production-1m
observability_grafana_default_contact_point: Grafana IRM
observability_grafana_default_evaluation_interval: 1m

observability_public_status_services:
  openai:
    name: OpenAI
    url: https://status.openai.com/api/v2/summary.json
    components:
      - id: "01JMXBNJXGV1T5GT2M9XA83XNG"
        name: Conversations
      - id: "01KMKFAMWKQ81YWSE1Z18R6VHR"
        name: Codex in ChatGPT Desktop
      - id: "01JQ7EKW990MSPSWVXC7VPV2ZJ"
        name: Image Generation
      - id: "01JMXBNJXG1S2D9V65P1ZZTD94"
        name: ChatGPT Login
  digitalocean:
    name: DigitalOcean
    url: https://status.digitalocean.com/api/v2/summary.json
    components:
      - id: "p1x9rv4137gx"
        name: API
      - id: "5rzxjrq10gb2"
        name: Networking — Global
      - id: "kwqnp70p9wjy"
        name: VPC — Global
      - id: "dkbfnt2ghbw4"
        name: Droplets — Global
      - id: "czck17wcspr5"
        name: Cloud Control Panel
      - id: "qdnryq0lymfk"
        name: DNS
      - id: "mrdxgk8b9l9m"
        name: Droplets — NYC3
      - id: "4945q9my8ycl"
        name: VPC — NYC3
      - id: "4lc0zwg56npx"
        name: Networking — NYC3
      - id: "yht2qc1zfp6x"
        name: Monitoring — Global
      - id: "grxx637rqt5r"
        name: Monitoring — NYC3

observability_cpu_warning_percent: 80
observability_memory_warning_percent: 80
observability_filesystem_warning_percent: 80
observability_filesystem_inode_warning_percent: 80
observability_swap_warning_percent: 80
observability_certificate_expiring_seconds: 1209600
observability_restic_stale_seconds: 100800
observability_gcs_stale_bucket_check_stale_seconds: 100800
observability_gcs_operation_refresh_seconds: 3600
observability_gcs_operation_stale_seconds: 10800
observability_google_monitoring_usage_refresh_seconds: 3600
observability_google_monitoring_usage_stale_seconds: 10800
observability_google_monitoring_monthly_warning_series: 800000
observability_gcs_class_a_monthly_warning_operations: 4000
observability_gcs_class_b_monthly_warning_operations: 40000

observability_service_units_common:
  - name: sshd.service
    check: sshd_service
    summary: SSH service is down
  - name: firewalld.service
    check: firewalld_service
    summary: firewalld service is down
  - name: fail2ban.service
    check: fail2ban_service
    summary: fail2ban service is down
  - name: chronyd.service
    check: chrony_service
    summary: Chrony service is down
  - name: auditd.service
    check: auditd_service
    summary: auditd service is down
  - name: do-agent.service
    check: digitalocean_agent_service
    summary: DigitalOcean agent service is down
  - name: grayhaven-restic-backup.timer
    check: restic_timer
    summary: Restic backup timer is down
  - name: grayhaven-restic-check.timer
    check: restic_check_timer
    summary: Restic integrity check timer is down

observability_service_units_web:
  - name: nginx.service
    check: nginx_service
    summary: Nginx service is down
  - name: grayhaven-timetracker.service
    check: timetracker_service
    summary: Time Tracker service is down
  - name: certbot-renew.timer
    check: certbot_renew_timer
    summary: Certbot renewal timer is down
  - name: grayhaven-website-deploy-webhook.service
    check: website_deploy_webhook_service
    summary: Website deploy webhook service is down

observability_service_units_mcp:
  - name: nginx.service
    check: nginx_service
    summary: Nginx service is down
  - name: grayhaven-mcp.service
    check: mcp_service
    summary: MCP service is down
  - name: certbot-renew.timer
    check: certbot_renew_timer
    summary: Certbot renewal timer is down

observability_service_units_control_node:
  - name: grayhaven-ansible-runner.timer
    check: ansible_runner_timer
    summary: Ansible runner timer is down
  - name: grayhaven-ansible-poller.timer
    check: ansible_poller_timer
    summary: Ansible poller timer is down
  - name: grayhaven-gcs-restic-stale-buckets.timer
    check: gcs_stale_bucket_check_timer
    summary: Stale GCS bucket check timer is down
